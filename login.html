
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopEase | Login & Register</title>
    <link rel="stylesheet" href="login.css">
    <script src="login.js" defer></script>
</head>

<body>

    <div class="auth-container">

        <div class="auth-brand">
            <h1><span>Shop</span>Ease</h1>
            <p>Your everyday shopping destination</p>
        </div>

        <div class="auth-card">

            <div class="auth-header">
                <h2 id="formTitle">Welcome Back!</h2>
                <p id="formSubtitle">Login to continue shopping.</p>
            </div>

            <div class="auth-tabs">
                <button id="loginTab" class="tab active" type="button">
                    Login
                </button>

                <button id="registerTab" class="tab" type="button">
                    Create Account
                </button>
            </div>

            <!-- LOGIN FORM -->
            <form id="loginForm">

                <div class="form-group">
                    <label for="loginEmail">Email Address</label>
                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <button type="submit" class="auth-button">
                    Login
                </button>

            </form>

            <!-- CREATE ACCOUNT FORM -->
            <form id="registerForm" class="hidden">

                <div class="form-group">
                    <label for="registerName">Full Name</label>
                    <input
                        type="text"
                        id="registerName"
                        placeholder="Enter your full name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="registerEmail">Email Address</label>
                    <input
                        type="email"
                        id="registerEmail"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="registerPassword">Password</label>
                    <input
                        type="password"
                        id="registerPassword"
                        placeholder="Minimum 6 characters"
                        minlength="6"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        minlength="6"
                        required
                    >
                </div>

                <button type="submit" class="auth-button">
                    Create Account
                </button>

            </form>

            <p id="authMessage" class="message"></p>

            <p class="auth-note">
                By continuing, you agree to ShopEase's demo terms.
            </p>

        </div>

        <footer>
            © 2026 ShopEase. All rights reserved.
        </footer>

    </div>

</body>
</html>
